name: Build and test Macventory
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      selection_scenario:
        description: Temporary selection diagnostics; run isolated/paths before full
        required: true
        default: isolated
        type: choice
        options: [isolated, paths, after-layout, after-headers, full]
permissions:
  contents: read
defaults:
  run:
    shell: bash
# macos-26 is the standard Apple Silicon image. Do not use its changing default Xcode.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
  MACVENTORY_LIVE_TESTS: '0'
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner and pinned toolchain
        run: bash scripts/verify-ci-toolchain.sh
      - name: Swift package build
        run: bash scripts/swift-tool.sh build 2>&1 | tee build/verification/swift-build.log
      - name: Swift package tests (synthetic fixtures)
        run: bash scripts/swift-tool.sh test --disable-xctest 2>&1 | tee build/verification/swift-tests.log
      - name: Xcode project build
        run: |
          xcodebuild -project Macventory.xcodeproj -scheme Macventory \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build \
            2>&1 | tee build/verification/xcode-build.log
      - name: Compile all Xcode test targets
        run: |
          xcodebuild -project Macventory.xcodeproj -scheme Macventory \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build-for-testing \
            2>&1 | tee build/verification/xcode-test-build.log
      - name: Xcode unit tests (isolated app host)
        run: |
          xcodebuild -project Macventory.xcodeproj -scheme Macventory \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            -resultBundlePath build/verification/UnitTests.xcresult \
            -only-testing:MacventoryTests -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= test-without-building \
            2>&1 | tee build/verification/xcode-unit-tests.log
      - name: Package arm64 app, ZIP, DMG and source
        run: bash scripts/package-release.sh 2>&1 | tee build/verification/package.log
      - name: Validate arm64 artifacts
        run: bash scripts/validate-artifacts.sh 2>&1 | tee build/verification/artifacts.log
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-arm64
          path: |
            build/verification/
            build/Macventory.app
            artifacts/*
          if-no-files-found: warn
          retention-days: 14
  ui:
    name: XCUITest (synthetic inventory and simulated removal)
    runs-on: macos-26
    needs: native
    timeout-minutes: 40
    env:
      SELECTION_SCENARIO: ${{ github.event_name == 'workflow_dispatch' && inputs.selection_scenario || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner and pinned toolchain
        run: bash scripts/verify-ci-toolchain.sh
      - name: XCUITest
        id: gui
        # Keep the primary build/package result independent of hosted GUI availability.
        # An unsuccessful attempt is never reported as a passing GUI test.
        continue-on-error: true
        timeout-minutes: 25
        run: |
          selected=MacventoryUITests/MacventoryUITests
          target=testExplicitExecutionLevelsAndInteractiveVerification
          filters=("-only-testing:$selected/$target")
          result_bundle="build/verification/Selection-$SELECTION_SCENARIO.xcresult"
          case "$SELECTION_SCENARIO" in
            isolated) ;;
            paths) filters=("-only-testing:MacventoryUITests/MacventorySelectionPathDiagnostics") ;;
            after-layout) filters+=("-only-testing:$selected/testDetailsActionsStayVisibleAcrossLayoutsAndLongMetadata") ;;
            after-headers) filters+=("-only-testing:$selected/testAllNativeHeaderSortsPreserveSelection") ;;
            full) filters=("-only-testing:$selected"); result_bundle=build/verification/UITests.xcresult ;;
            *) exit 2 ;;
          esac
          printf '%s\n' "$SELECTION_SCENARIO" > build/verification/selection-scenario.txt
          git rev-parse HEAD > build/verification/tested-head.txt
          set +e
          xcodebuild -project Macventory.xcodeproj -scheme Macventory \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            -resultBundlePath "$result_bundle" \
            "${filters[@]}" -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= test \
            2>&1 | tee build/verification/xcode-ui-tests.log
          results=("${PIPESTATUS[@]}")
          set -e
          # A cancelled shell can leave the app's test runner alive. Only a normal
          # Xcode terminal result permits another GUI diagnostic on this desktop.
          if [[ "${results[0]}" == 0 || "${results[0]}" == 65 ]] && \
             [[ -f "$result_bundle/Info.plist" ]] && \
             grep -Eq '^\*\* TEST (SUCCEEDED|FAILED) \*\*$' build/verification/xcode-ui-tests.log; then
            echo 'primary_finished=true' >> "$GITHUB_OUTPUT"
          fi
          if [[ "${results[0]}" != 0 ]]; then exit "${results[0]}"; fi
          exit "${results[1]}"
      - name: Verify actual GUI test count, outcome and requested order
        id: sequence
        if: always()
        run: python3 scripts/verify-ui-selection-run.py "$SELECTION_SCENARIO" build/verification/xcode-ui-tests.log | tee build/verification/gui-sequence.json
      - name: Compare synthetic native header proxies on the hosted runtime
        if: always() && steps.gui.outputs.primary_finished == 'true' && env.SELECTION_SCENARIO == 'full'
        timeout-minutes: 5
        run: bash scripts/probe-header-proxies.sh "$PWD/build/DerivedData/Build/Products/Debug"
      - name: Diagnose Source header with actual element-relative mouse clicks
        if: always() && steps.gui.outputs.primary_finished == 'true' && env.SELECTION_SCENARIO == 'full'
        timeout-minutes: 3
        run: |
          xcodebuild -project Macventory.xcodeproj -scheme Macventory \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/DerivedData \
            -resultBundlePath build/verification/HeaderPointerDiagnostic.xcresult \
            -only-testing:MacventoryUITests/MacventoryHeaderPointerDiagnostics -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= test-without-building \
            2>&1 | tee build/verification/header-pointer-diagnostic.log
      - name: Report actual GUI test outcome
        if: always()
        env:
          GUI_OUTCOME: ${{ steps.gui.outcome }}
          PRIMARY_FINISHED: ${{ steps.gui.outputs.primary_finished }}
          SEQUENCE_OUTCOME: ${{ steps.sequence.outcome }}
        run: |
          if [[ "$PRIMARY_FINISHED" != true ]]; then
            echo 'Primary Xcode execution did not finalize normally. Further GUI diagnostics were withheld to avoid overlapping test processes; retained xcresult evidence may be incomplete.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$GUI_OUTCOME" == success && "$PRIMARY_FINISHED" == true && "$SEQUENCE_OUTCOME" == success ]]; then
            echo "Primary XCUITest scenario '$SELECTION_SCENARIO' passed using synthetic fixtures. Inspect gui-sequence.json for actual counts; only 'full' verifies the 16-case primary suite." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::XCUITest did not validate (execution: $GUI_OUTCOME, sequence: $SEQUENCE_OUTCOME, finalized: $PRIMARY_FINISHED). Inspect the uploaded log and xcresult."
            echo "Primary XCUITest scenario '$SELECTION_SCENARIO' did NOT validate (execution: $GUI_OUTCOME, sequence: $SEQUENCE_OUTCOME, finalized: $PRIMARY_FINISHED). Primary arm64 checks are independent." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-ui
          path: build/verification/
          if-no-files-found: warn
          retention-days: 14
